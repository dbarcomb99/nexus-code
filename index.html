<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS_CODE // Cybernetic Python Training</title>
    <!-- Pyodide for Browser Python Execution -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b0f19;
            --border-neon: #1e293b;
            --cyan: #06b6d4;
            --magenta: #ec4899;
            --emerald: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Scanline Overlay */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-neon);
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
        }

        .stat-val {
            color: var(--emerald);
            font-weight: bold;
        }

        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            height: calc(100vh - 65px);
        }

        /* Quest Tree Sidebar */
        aside {
            border-right: 1px solid var(--border-neon);
            background: var(--bg-card);
            padding: 1.5rem;
            overflow-y: auto;
        }

        aside h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .quest-node {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-neon);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quest-node:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }

        .quest-node.active {
            border-color: var(--cyan);
            background: rgba(6, 182, 212, 0.05);
        }

        .quest-node.completed {
            border-color: var(--emerald);
            background: rgba(16, 185, 129, 0.05);
        }

        .quest-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .quest-status {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Workspace Grid */
        .workspace {
            display: grid;
            grid-template-rows: 1fr 220px;
            background: var(--bg-deep);
        }

        .editor-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--border-neon);
            overflow: hidden;
        }

        .mission-panel {
            padding: 2rem;
            border-right: 1px solid var(--border-neon);
            overflow-y: auto;
        }

        .mission-panel h2 {
            color: var(--cyan);
            margin-bottom: 0.75rem;
            font-size: 1.3rem;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--magenta);
            margin-top: 1.25rem;
            margin-bottom: 0.35rem;
            display: block;
        }

        .mission-panel p, .mission-panel li {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .mission-panel code {
            background: rgba(30, 41, 59, 0.7);
            color: var(--cyan);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .code-container {
            display: flex;
            flex-direction: column;
            background: #05070d;
        }

        .code-header {
            padding: 0.5rem 1rem;
            background: rgba(30, 41, 59, 0.3);
            border-bottom: 1px solid var(--border-neon);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        textarea {
            flex: 1;
            background: transparent;
            color: var(--cyan);
            border: none;
            padding: 1rem;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        /* Terminal Console */
        .terminal {
            background: #020408;
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .action-btns {
            display: flex;
            gap: 1rem;
        }

        button {
            background: var(--cyan);
            color: var(--bg-deep);
            border: none;
            padding: 0.5rem 1.5rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        button:hover {
            box-shadow: 0 0 15px var(--cyan);
            background: #22d3ee;
        }

        .btn-hint {
            background: transparent;
            color: var(--magenta);
            border: 1px solid var(--magenta);
        }

        .btn-hint:hover {
            background: rgba(236, 72, 153, 0.1);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
        }

        pre#output {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-neon);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            color: var(--emerald);
            font-size: 0.85rem;
            flex: 1;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ NEXUS_CODE v1.0</div>
        <div class="stats-bar">
            <div class="stat-item">LVL: <span class="stat-val" id="level-display">01</span></div>
            <div class="stat-item">XP: <span class="stat-val" id="xp-display">0</span>/225</div>
            <div class="stat-item">STREAK: <span class="stat-val" id="streak-display">🔥 1</span></div>
        </div>
    </header>

    <div class="main-container">
        <aside id="sidebar-tree">
            <h3>Neural Skill Tree</h3>
            <!-- Dynamically populated -->
        </aside>

        <div class="workspace">
            <div class="editor-area">
                <div class="mission-panel">
                    <h2 id="quest-heading">Loading...</h2>
                    
                    <span class="section-label">📖 Lesson Briefing</span>
                    <p id="quest-lesson">Loading briefing...</p>

                    <span class="section-label">🎯 Mission Objective</span>
                    <p id="quest-desc">Loading objective...</p>

                    <div id="ai-hint-box" style="margin-top: 1rem; color: var(--magenta); font-size: 0.85rem;"></div>
                </div>
                <div class="code-container">
                    <div class="code-header">
                        <span id="file-name">terminal_main.py</span>
                        <span>PYTHON 3.11</span>
                    </div>
                    <textarea id="code-input" placeholder="# Write your solution here..."></textarea>
                </div>
            </div>

            <div class="terminal">
                <div class="terminal-header">
                    <span>EXECUTION_BUFFER // OUTPUT</span>
                    <div class="action-btns">
                        <button class="btn-hint" onclick="requestAiHint()">AI Tactical Hint</button>
                        <button onclick="runPythonCode()">Execute Code ❯</button>
                    </div>
                </div>
                <pre id="output">System initializing... Awaiting execution command.</pre>
            </div>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer for Retro SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'run') {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Curriculum Database (Boot.dev Style: Lesson + Challenge + Blank Starter Code)
        const quests = [
            {
                id: 1,
                title: "01. Output Stream",
                lesson: "In Python, the <code>print()</code> function is your primary tool for sending text to the output terminal. Anything placed inside the parentheses as a string (wrapped in quotes) will be displayed on the screen.",
                desc: "Establish connection with the mainframe by writing a <code>print()</code> command that outputs the exact string: <code>ACCESS_GRANTED</code>",
                starterCode: '# Type your print command below\n',
                expected: "ACCESS_GRANTED",
                xp: 50
            },
            {
                id: 2,
                title: "02. Variable Injection",
                lesson: "Variables act as containers to store data in memory. You assign values to variables using the <code>=</code> operator. Once stored, you can reference the variable name instead of repeating raw data.",
                desc: "Store your agent codename in a variable named <code>agent</code> with the value <code>"Ghost_Runner"</code>, then print the variable.",
                starterCode: '# Assign and print your agent variable\n',
                expected: "Ghost_Runner",
                xp: 75
            },
            {
                id: 3,
                title: "03. Neural Loop",
                lesson: "Loops automate repetitive tasks. A <code>for</code> loop iterates over a sequence of numbers using <code>range(start, stop)</code>, where the stop value is exclusive.",
                desc: "Write a <code>for</code> loop that uses <code>range(1, 4)</code> to print numbers 1, 2, and 3 sequentially.",
                starterCode: '# Write your loop below\n',
                expected: "1\n2\n3",
                xp: 100
            }
        ];

        let currentQuestIndex = 0;
        let pyodideReady = false;
        let pyodide;
        let currentXP = 0;

        // Render Sidebar Skill Tree
        function renderSidebar() {
            const tree = document.getElementById("sidebar-tree");
            tree.innerHTML = '<h3>Neural Skill Tree</h3>';
            
            quests.forEach((q, idx) => {
                let statusClass = "";
                let statusText = "[LOCKED]";
                
                if (idx < currentQuestIndex) {
                    statusClass = "completed";
                    statusText = "[COMPLETED] ✔";
                } else if (idx === currentQuestIndex) {
                    statusClass = "active";
                    statusText = `[ACTIVE] +${q.xp} XP`;
                }

                tree.innerHTML += `
                    <div class="quest-node ${statusClass}" onclick="switchQuest(${idx})">
                        <div class="quest-title">${q.title}</div>
                        <div class="quest-status">${statusText}</div>
                    </div>
                `;
            });
        }

        // Load a quest onto the screen
        function loadQuest(index) {
            if (index >= quests.length) return;
            currentQuestIndex = index;
            const q = quests[index];
            
            document.getElementById("quest-heading").innerText = `Quest ${q.id}: ${q.title.split('. ')[1]}`;
            document.getElementById("quest-lesson").innerHTML = q.lesson;
            document.getElementById("quest-desc").innerHTML = q.desc;
            document.getElementById("code-input").value = q.starterCode;
            document.getElementById("ai-hint-box").innerText = "";
            document.getElementById("output").innerText = "System ready. Awaiting code execution.";
            
            renderSidebar();
        }

        function switchQuest(index) {
            if (index <= currentQuestIndex) {
                loadQuest(index);
            } else {
                alert("Complete previous security protocols to unlock this node.");
            }
        }

        // Initialize Pyodide
        async function initPyodide() {
            const out = document.getElementById("output");
            out.innerText = "Loading Pyodide WebAssembly runtime...";
            pyodide = await loadPyodide();
            pyodideReady = true;
            out.innerText = "System online. Ready for code execution.";
            loadQuest(0);
        }
        initPyodide();

        async function runPythonCode() {
            if (!pyodideReady) {
                alert("Runtime still loading...");
                return;
            }
            playSound('run');
            const code = document.getElementById("code-input").value;
            const outputPre = document.getElementById("output");
            outputPre.innerText = "Executing in sandbox...";

            try {
                pyodide.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);

                pyodide.runPython(code);
                let stdout = pyodide.runPython("sys.stdout.getvalue()");
                outputPre.innerText = stdout;

                let targetOutput = quests[currentQuestIndex].expected.trim();
                if (stdout.trim() === targetOutput) {
                    playSound('success');
                    const earnedXP = quests[currentQuestIndex].xp;
                    outputPre.innerText += `\n\n[✔] TEST PASSED: +${earnedXP} XP`;
                    currentXP += earnedXP;
                    document.getElementById("xp-display").innerText = currentXP;
                    
                    currentQuestIndex++;
                    renderSidebar();

                    if (currentQuestIndex < quests.length) {
                        setTimeout(() => {
                            loadQuest(currentQuestIndex);
                        }, 2000);
                    } else {
                        outputPre.innerText += "\n\n🎉 ALL PROTOCOLS COMPLETED. SYSTEM MASTERED.";
                    }
                } else {
                    outputPre.innerText += "\n\n[✖] TEST FAILED: Output did not match expected transmission string.";
                }
            } catch (err) {
                outputPre.innerText = "ERROR:\n" + err;
            }
        }

        function requestAiHint() {
            playSound('run');
            const hints = [
                "Hint: Use the print() function with the exact text string inside double quotes.",
                "Hint: Assign the string to variable 'agent' on line 1, then type print(agent) on line 2.",
                "Hint: Your for loop syntax should look like: for i in range(1, 4): print(i)"
            ];
            document.getElementById("ai-hint-box").innerText = `AI Assistant: ${hints[currentQuestIndex]}`;
        }
    </script>
</body>
</html>
